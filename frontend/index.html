        document.addEventListener('DOMContentLoaded', function() {
          document.body.innerHTML = `

              </p>
              <div style="background: #091222; border: 1px solid #1e3a63; padding: 20px 28px; border-radius: 16px; text-align: left; max-width: 460px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">

                  <li>Double-click <strong style="color: #38bdf8;">run.bat</strong></li>
                  <li>Or open a terminal here and run: <code style="color: #4ade80; background: #030712; padding: 2px 6px; border-radius: 4px;">npm start</code></li>

              </div>
            </div>

    <script type="module" src="/src/main.jsx"></script>
